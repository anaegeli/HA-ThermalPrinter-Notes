################################################################################
# Remote package: Olimex ESP32-POE-ISO (WROOM), selectable Ethernet or Wi-Fi
################################################################################

packages:
  defaults: !include defaults.yaml
  network: !include network-${network_type}.yaml

esphome:
  min_version: 2026.7.0
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: ${project_name}
    version: ${project_version}

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: ${esp32_framework}

logger:
  level: ${logger_level}
  baud_rate: 0

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}
