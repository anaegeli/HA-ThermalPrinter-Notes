################################################################################
# Remote package: Olimex ESP32-POE-ISO (WROOM), selectable Ethernet or Wi-Fi
################################################################################

packages:
  defaults: !include defaults.yaml
  network: !include network-${network_type}.yaml
  # Lookup rejects misspelled modes instead of silently switching to DHCP.
  addressing: >-
    ${ {"dhcp": {}, "static": {network_type: {"manual_ip": {"static_ip": static_ip, "gateway": gateway, "subnet": subnet, "dns1": dns1, "dns2": dns2}}}}[ip_mode] }
  upload_address: >-
    ${ {network_type: {"use_address": network_use_address}} if network_use_address else {} }
  web_interface: >-
    ${ {"false": {}, "true": {"web_server": {"port": web_server_port, "version": web_server_version, "local": web_server_local, "include_internal": web_server_include_internal}}}[web_server_enabled] }

esphome:
  min_version: 2026.7.0
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: ${project_name}
    version: ${project_version}

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: ${esp32_framework}

logger:
  level: ${logger_level}
  baud_rate: 0

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}
