################################################################################
# Remote package: Cashino EP-261C TTL thermal printer
#
# Wiring defaults:
#   ESP32 GND   <-> EP-261C GND
#   ESP32 GPIO4  -> EP-261C RX
#   ESP32 GPIO5 <-  EP-261C TX
#
# The tested printer is the 12 V model. Verify the printer label and power it
# from a correctly rated supply. Verify printer TX is safe for ESP32 3.3 V IO.
################################################################################

packages:
  cashino_common: !include cashino-common.yaml

thermal_printer:
  model: EP-261C
