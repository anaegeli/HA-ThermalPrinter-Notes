# Device configuration: one ESP32 and one Cashino EP-261C printer.
# Edit installation settings here. Shared hardware defaults live in
# esphome/packages/defaults.yaml and may be overridden below when needed.
substitutions:
  # Choose exactly one: ethernet or wifi. Changing this requires new firmware.
  network_type: ethernet
  device_name: thermal-printer
  friendly_name: Thermal Printer

  api_encryption_key: !secret esphome_api_encryption_key
  ota_password: !secret esphome_ota
  # Wi-Fi only: add wifi_ssid and wifi_password to your local secrets.yaml.
  # Ethernet installations do not need Wi-Fi secrets.

  # UART wiring for this installation (ESP TX -> printer RX and vice versa).
  printer_tx_pin: GPIO4
  printer_rx_pin: GPIO5

# Packages and the external component follow main by default.
# For a pinned installation, set both @main refs below and
# substitutions.thermal_printer_ref to the same release tag.
packages:
  olimex_esp32_poe_iso: github://anaegeli/HA-ThermalPrinter-Notes/esphome/packages/olimex-esp32-poe-iso.yaml@main
  cashino_ep_261c: github://anaegeli/HA-ThermalPrinter-Notes/esphome/packages/cashino-ep-261c.yaml@main

dashboard_import:
  package_import_url: github://anaegeli/HA-ThermalPrinter-Notes/esphome/thermal-printer.yaml@main
  import_full_config: false
