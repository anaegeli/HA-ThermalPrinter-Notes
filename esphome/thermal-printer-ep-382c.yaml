# Compatibility entry point for old dashboard links.
# New installations use thermal-printer.yaml and set printer_model: ep-382c.
substitutions:
  printer_model: ep-382c
  device_name: thermal-printer-80
  friendly_name: Thermal Printer 80 mm
  thermal_printer_ref: main
packages:
  unified: github://anaegeli/HA-ThermalPrinter-Notes/esphome/thermal-printer.yaml@${thermal_printer_ref}

dashboard_import:
  package_import_url: github://anaegeli/HA-ThermalPrinter-Notes/esphome/thermal-printer-ep-382c.yaml@main
  import_full_config: true
