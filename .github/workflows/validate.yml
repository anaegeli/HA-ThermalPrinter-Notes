name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Validate Python syntax
        run: python -m compileall -q custom_components
      - name: Validate JavaScript syntax
        run: node --check custom_components/thermal_printer_notes/frontend/thermal-printer-notes-card.js
      - name: Test preview and printer selection
        run: node tests/test_printers.js
      - name: Test both model previews
        run: node tests/test_models.js
      - name: Test emitted printer bytes and hardware status
        run: python tests/test_driver.py
      - name: Test legacy and existing storage compatibility
        run: python tests/test_upgrade.py
      - name: Validate JSON files
        run: python -c 'import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path(".").rglob("*.json")]'

  esphome:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["2026.7.3", "2026.8.2"]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install esphome==${{ matrix.version }}
      - name: Validate both printers with Ethernet and Wi-Fi
        run: python tests/test_esphome.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ["EP-261C", "EP-382C"]
        network: [ethernet, wifi]
        ip_mode: [dhcp, static]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install esphome==2026.8.2
      - name: Compile selected printer, network and address mode
        run: python tests/test_esphome.py --compile --model ${{ matrix.model }} --network ${{ matrix.network }} --ip-mode ${{ matrix.ip_mode }}

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
